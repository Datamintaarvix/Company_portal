<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATAMINT AARVIX | Enterprise HRMS</title>
  <meta name="csrf-cookie-name" content="{{ csrf_cookie_name or 'csrf_token' }}">
  <link rel="stylesheet" href="/static/css/portal.css">
</head>
<body class="login-body">
  <main class="login-card" role="main">
    <div class="login-header">
      <!-- DATAMINT AARVIX Corporate Logo -->
      <div class="login-brand-wrapper brand-badge">
        <img
          src="/static/img/datamint-aarvix-logo.jpg"
          alt="DATAMINT AARVIX Enterprise HRMS"
          class="login-brand-logo"
        >
      </div>
    </div>

    <!-- Alert Banner Container -->
    <div id="alertContainer" role="alert" aria-live="polite"></div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="emailInput" class="form-label">Corporate Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="emailInput"
            name="email"
            class="form-input"
            placeholder="name@company.com"
            autocomplete="username"
            required
            aria-required="true"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="passwordInput"
            name="password"
            class="form-input"
            placeholder="••••••••••••"
            autocomplete="current-password"
            required
            aria-required="true"
          >
          <button
            type="button"
            id="togglePasswordBtn"
            class="password-toggle-btn"
            aria-label="Toggle password visibility"
          >Show</button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-primary">
        <span id="loginBtnText">Sign In</span>
        <span id="loginBtnSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
      </button>
    </form>

    <footer style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-light);">
      &copy; DATAMINT AARVIX &bull; Company Employee Portal. Secure authentication with Argon2id &amp; HTTP-only sessions.
    </footer>
  </main>

  <script src="/static/js/portal.js"></script>
</body>
</html>
